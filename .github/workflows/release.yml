name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:EnableCompressionInSingleFile=true -o publish/win-x64
          cd publish/win-x64
          zip -r ../../LotroArchiver-win-x64.zip *

      - name: Publish Linux
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:EnableCompressionInSingleFile=true -o publish/linux-x64
          cd publish/linux-x64
          zip -r ../../LotroArchiver-linux-x64.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LotroArchiver-win-x64.zip
            LotroArchiver-linux-x64.zip
          generate_release_notes: true